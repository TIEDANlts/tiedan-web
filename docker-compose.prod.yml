services:
  app:
    image: ${APP_IMAGE:-tiedan-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      PORT: 3000
      HOSTNAME: 0.0.0.0
      UPLOAD_DIR: /data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    networks:
      - tiedan_web

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tiedan_web

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads_data:/data/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tiedan_web

volumes:
  postgres_data:
    name: tiedan_web_postgres_data
  uploads_data:
    name: tiedan_web_uploads_data
  caddy_data:
    name: tiedan_web_caddy_data
  caddy_config:
    name: tiedan_web_caddy_config

networks:
  tiedan_web:
    name: tiedan_web
