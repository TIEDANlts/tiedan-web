name: Quality and Manual Deploy

on:
  push:
    branches:
      - main
      - "stage-*"
      - "feature/**"
      - "fix/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://personal_site:personal_site@localhost:5432/personal_site
        run: npx prisma generate

      - name: Run check
        run: npm run check

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          test -n "$REGISTRY_HOST"
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"
          test -n "$REGISTRY_IMAGE"
          test -n "$SSH_KEY"
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_DEPLOY_PATH"

      - name: Login to registry
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push image
        env:
          REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
        run: |
          docker build -t "$REGISTRY_IMAGE:${GITHUB_SHA}" -t "$REGISTRY_IMAGE:latest" .
          docker push "$REGISTRY_IMAGE:${GITHUB_SHA}"
          docker push "$REGISTRY_IMAGE:latest"

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_DEPLOY_PATH' && docker compose --env-file .env.production -f docker-compose.prod.yml pull && docker compose --env-file .env.production -f docker-compose.prod.yml up -d"
